# yatr - https://github.com/cargopete/yatr
#
# These tasks are what .github/workflows CI runs, command for command, so
# `yatr ci` locally is the same gate. The workflow calls these tasks by name:
# change a command here and CI changes with it.
#
# The aggregate is `ci`, not `check`: `yatr check` is a builtin that validates
# this file and shadows any task of that name without warning.

[settings]
cache = true

[tasks.fmt]
desc = "Format the Rust tree"
run = ["cargo fmt --all"]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the Rust tree is unformatted (CI: rust-fmt)"
run = ["cargo fmt --all --check"]
sources = ["**/*.rs"]

[tasks.lint]
desc = "Clippy with warnings denied (CI: rust-clippy)"
run = ["cargo clippy --all-targets --all-features -- -D warnings"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.test]
desc = "Run the Rust test suite (CI: rust-test)"
run = ["cargo test --all"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]
watch = ["**/*.rs"]

[tasks.sol-fmt]
desc = "Format the Solidity"
run = ["forge fmt"]
cwd = "contracts"
no_cache = true

[tasks.sol-fmt-check]
desc = "Fail if the Solidity is unformatted (CI: sol-fmt)"
run = ["forge fmt --check"]
cwd = "contracts"
sources = ["**/*.sol"]

[tasks.sol-test]
desc = "Run the Forge test suite (CI: sol-test)"
run = ["forge test -vv"]
cwd = "contracts"
sources = ["**/*.sol", "foundry.toml"]

[tasks.build]
desc = "Build the binaries (CI: e2e prerequisite)"
run = ["cargo build --bins"]
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]

[tasks.e2e]
desc = "End-to-end suite (CI: e2e; needs node and a local chain)"
run = ["npm install", "npm test"]
cwd = "e2e"
depends = ["build"]
no_cache = true

[tasks.up]
desc = "Start services"
run = ["docker compose up"]
foreground = true
no_cache = true

[tasks.down]
desc = "Stop services"
run = ["docker compose down"]
no_cache = true

[tasks.logs]
desc = "Tail logs"
run = ["docker compose logs -f"]
foreground = true
no_cache = true

[tasks.ci]
desc = "What CI runs: fmt-check, lint, test, sol-fmt-check, sol-test"
depends = ["fmt-check", "lint", "test", "sol-fmt-check", "sol-test"]
run = []
