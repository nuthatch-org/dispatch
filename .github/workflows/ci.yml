name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Rust ──────────────────────────────────────────────────────────────────────

env:
  # The commands CI runs live in yatr.toml, so `yatr ci` locally is the
  # same gate. Bump deliberately.
  YATR_VERSION: "1.1.0"

jobs:
  rust-fmt:
    name: Rust / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr fmt-check

  rust-clippy:
    name: Rust / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr lint

  rust-test:
    name: Rust / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr test

# ── Solidity ──────────────────────────────────────────────────────────────────

  sol-fmt:
    name: Solidity / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr sol-fmt-check

  sol-test:
    name: Solidity / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: contracts/cache
          key: forge-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**', 'contracts/test/**') }}
          restore-keys: forge-
      - name: Cache yatr
        id: cache-yatr
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/yatr
          key: yatr-${{ runner.os }}-${{ env.YATR_VERSION }}

      - name: Install yatr
        if: steps.cache-yatr.outputs.cache-hit != 'true'
        # RUSTFLAGS is cleared deliberately: yatr is a different crate and must
        # not inherit this project's flags (a `-D warnings` or a custom linker
        # would fail or mislink the install).
        run: cargo install yatr --version ${{ env.YATR_VERSION }} --locked
        env:
          RUSTFLAGS: ""

      - run: yatr sol-test

# ── E2E ───────────────────────────────────────────────────────────────────────

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install e2e dependencies
        run: npm install
        working-directory: e2e
      - name: Build Rust binaries
        run: cargo build --bins
      - name: Run e2e suite
        run: npm test
        working-directory: e2e
        env:
          RUST_LOG: warn
